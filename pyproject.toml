[project]
name = "sicherheitslotse"
version = "0.1.0"
description = "German occupational-safety Q&A with citations and measured quality"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.16",
    "lxml",
    "mistralai>=3.7.0",
    "numpy>=2.5.4",
    "pydantic>=2.14",
    "pystemmer>=3.1.0",
    "tokenizers",
    "torch==2.13.0",
    "transformers>=5.22.1",
]

[dependency-groups]
test = [
    "pytest",
    "ruff",
]
dev = [
    { include-group = "test" },
    "docling>=2.145.0",
    "pypdfium2>=5.14.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lotse"

[tool.ruff]
line-length = 100
