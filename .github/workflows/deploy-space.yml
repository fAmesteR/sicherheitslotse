name: Deploy Space

# Pushes the demo to the Hugging Face Space after CI has passed on main, or when started by hand.
# It needs HF_DEPLOY_TOKEN, a fine-grained token with write access to the Space alone. Without the
# secret the job skips its upload.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points to by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.3.3
      # The script only needs huggingface_hub and lotse.config, not torch and the models.
      - if: env.HF_TOKEN != ''
        run: >
          uv run --no-project --with huggingface-hub==1.33.0
          python scripts/deploy_space.py --upload
        env:
          PYTHONPATH: src
