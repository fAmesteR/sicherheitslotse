name: Answer evaluation

# Started by hand, because it costs API calls and over an hour of CPU time: it answers the dev
# questions, lets the judge model grade them, and fails if citation validity or faithfulness fall
# more than 0.05 below eval/baseline.json.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  answers:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: models-bge-m3-and-reranker
      - run: uv run --no-sync python eval/run_answers.py --gate
      - if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: answer-evaluation
          path: eval/results/*_answers.json
